name: cross-review planted-round (weekly)

# Weekly ground-truth mutation-recall drill (#116): plants a synthetic
# defect via cross-review/ci/planted_round.sh and runs a roster against it.
# A hosted runner has no codex or agy login, so the roster has to be seats
# that work from an API key alone.
#
# Default roster: glm-coding, the GLM Coding Plan baseline, which reads its
# key from the ZAI_API_KEY secret. It does not go through OpenRouter.
#
# This drill used to run glm,deepseek,qwen on OpenRouter. run_reviewers.sh
# skips every OpenRouter seat while CROSS_REVIEW_OPENROUTER is 0 (the default
# since 2026-09-07), so each scheduled run ended in "no reviewers available
# or requested". To drill the OpenRouter pool again without editing this
# file, set two repository variables, PLANTED_ROUND_ROSTER (for example
# glm,deepseek,qwen) and PLANTED_ROUND_OPENROUTER=1, and add the
# OPENROUTER_API_KEY secret.
#
# Recorded ledger rows (runlog.jsonl, finding_events.jsonl) are NOT committed
# back — they're gitignored working state, same as every other cross-review
# run; this workflow only uploads them as a build artifact for a human to
# inspect or fold into the live leaderboard by hand.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  planted-round:
    runs-on: ubuntu-latest
    # One glm-coding lap is budgeted 600s below and may be retried once.
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Run planted-mutation drill (key-only roster)
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PLANTED_ROUND_ROSTER: ${{ vars.PLANTED_ROUND_ROSTER || 'glm-coding' }}
          CROSS_REVIEW_OPENROUTER: ${{ vars.PLANTED_ROUND_OPENROUTER || '0' }}
          # planted_round.sh defaults to 120s per seat, sized for a single
          # OpenRouter completion. glm-coding runs a multi-turn tool loop:
          # over 881 local laps its median was 117s and its p90 298s.
          CROSS_REVIEW_PLANTED_TIMEOUT_S: "600"
        # The ledgers are written to $out (not the checkout's gitignored
        # defaults) so the uploaded artifact actually carries the synthetic
        # runlog row and the planted/caught/missed events this drill exists
        # to produce.
        run: |
          out="$RUNNER_TEMP/planted-round"
          # Exported BEFORE the drill runs so the if: always() upload still
          # finds raw/ and meta.json when the script exits non-zero.
          echo "PLANTED_ROUND_OUT=$out" >> "$GITHUB_ENV"
          mkdir -p "$out"

          # Fail on a missing key here, with the fix in the message. Without
          # this the seat is skipped a few layers down and the run ends in
          # "no reviewers available or requested", which names no cause.
          case ",$PLANTED_ROUND_ROSTER," in
            *,glm-coding,*)
              if [ -z "$ZAI_API_KEY" ]; then
                echo "::error::The roster includes glm-coding but the ZAI_API_KEY secret is empty. Add it under Settings > Secrets and variables > Actions."
                exit 1
              fi
              ;;
          esac
          if [ "$CROSS_REVIEW_OPENROUTER" = "1" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::PLANTED_ROUND_OPENROUTER is 1 but the OPENROUTER_API_KEY secret is empty."
            exit 1
          fi

          export CROSS_REVIEW_RUNLOG="$out/runlog.jsonl"
          export CROSS_REVIEW_FINDING_EVENTS="$out/finding_events.jsonl"
          bash cross-review/ci/planted_round.sh \
            --repo-root "$GITHUB_WORKSPACE" \
            --operators-file cross-review/references/mutation_operators.json \
            --fixture auto \
            --roster "$PLANTED_ROUND_ROSTER" \
            --out "$out"

      - name: Upload drill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planted-round-${{ github.run_id }}
          path: ${{ env.PLANTED_ROUND_OUT }}
          if-no-files-found: warn
