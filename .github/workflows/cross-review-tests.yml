name: cross-review tests

# Offline fixture tests + dual-copy identity check for the cross-review skill.
# The identity check is the insurance against the three-way drift that PR #18
# had to untangle: the root skill copy and the plugin copy must stay
# byte-identical (runlog/telemetry excluded).

on:
  pull_request:
    paths:
      - "cross-review/**"
      - "plugins/cross-review/**"
      - ".github/workflows/cross-review-tests.yml"
  push:
    branches: [master]
    paths:
      - "cross-review/**"
      - "plugins/cross-review/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fixture tests (offline — shims, no tokens)
        run: bash cross-review/tests/run_tests.sh

      - name: Dual-copy identity check
        run: |
          # Same script the fixture suite calls — one exclude list, one
          # implementation. Exit 2 means the check could not locate the two
          # copies; in CI that is a failure, not a skip, because a guard that
          # quietly declines to run reads exactly like a passing one.
          # `run:` is bash -e, so take the status without letting it abort
          # the step — otherwise the error messages below never print.
          rc=0
          bash cross-review/tests/check_dual_copy.sh "$GITHUB_WORKSPACE" || rc=$?
          case "$rc" in
            0) echo "copies identical ✓" ;;
            1) echo "::error::root cross-review/ and plugins/.../cross-review have drifted — rsync one onto the other before merging"; exit 1 ;;
            *) echo "::error::dual-copy check could not resolve both copies under $GITHUB_WORKSPACE"; exit 1 ;;
          esac
