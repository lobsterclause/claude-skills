name: issue-drain tests

# Format, lint and test the issue-drain Rust crate, then smoke-test the launcher.

on:
  pull_request:
    paths:
      - "issue-drain/**"
      - ".github/workflows/issue-drain-tests.yml"
  push:
    branches: [master]
    paths:
      - "issue-drain/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stable toolchain with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Format
        run: cargo fmt --manifest-path issue-drain/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path issue-drain/Cargo.toml -- -D warnings

      - name: Tests
        run: cargo test --locked --manifest-path issue-drain/Cargo.toml

      - name: Builds on the declared rust-version
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' issue-drain/Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --locked --all-targets --manifest-path issue-drain/Cargo.toml

      - name: Launcher smoke test
        run: issue-drain/bin/issue-drain --help
