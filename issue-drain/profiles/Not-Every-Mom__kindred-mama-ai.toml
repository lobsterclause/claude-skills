# issue-drain profile: Not-Every-Mom/kindred-mama-ai
# Every key is explained in references/profile.md.

base_branch = "develop"

# An issue carrying any of these is left out at intake, with the label as the reason.
hold_labels = [
  "needs-human",
  "agent-needs-human",
  "ready-for-human",
  "needs-product-input",
  "needs-discussion",
  "design-needed",
  "blocked",
  "belongs-in-nem-app",
  "epic",
  "wont-fix",
  "wontfix",
  "duplicate",
  "invalid",
  "question",
]

claim_label = "agent-in-progress"
blocked_label = "needs-human"
tracker_label = "issue-drain"

# Highest priority first. An issue with none of these sorts last.
priority_labels = ["p0", "CRITICAL", "p1", "priority/high", "HIGH", "p2", "priority/medium", "MEDIUM", "p3", "LOW"]

# Matched against repo-relative paths, ignoring case.
# Protected: an issue whose fix lives here goes to "needs a person" and no unit runs.
protected_path_re = '^(\.github/(workflows|actions)/|\.husky/|\.claude/|infra/|ci/)|^(firestore|storage)\.rules$'
# Frozen: files or folders (a trailing slash is optional) a unit's diff may not touch;
# deliver-check fails the unit if it does. Nothing is frozen until this is filled in.
frozen_paths = []
# Risk: the unit runs, opens its PR, then waits for a named reviewer. Never clustered.
risk_path_re = '(^|/)[^/]*(crisis|clinical|billing|stripe|auth)[^/]*(/|$)'

trusted_associations = ["OWNER", "MEMBER", "COLLABORATOR"]

intake_cap = 40
stale_claim_days = 3

# Run in the checkout with ISSUE_TITLE and ISSUE_BODY set; prints JSON with
# "verdict" (app | mixed | kma | none) and "appPaths". "app" means every path
# the issue names has moved to Not-Every-Mom/nem-app, so the issue is left out.
issue_classifier = "node scripts/split-issue-triage.cjs"

cluster_max_issues = 4
cluster_max_lines = 400

evidence_line_slack = 3
evidence_min_quote = 8

# The unit-prepare step. The guards mod matches these as path prefixes, so the
# list says in files and folders what protected_path_re says in a pattern
# (a test holds the two together).
guard_protected_paths = [".github/workflows", ".github/actions", ".husky", ".claude", "infra", "ci", "firestore.rules", "storage.rules"]

# Run in the new worktree. .claude/scripts/worktree-bootstrap.sh clones node_modules from
# the main checkout (its line: `[ ! -d "$MAIN/node_modules" ]` stops it), so that must exist.
bootstrap_command = ".claude/scripts/worktree-bootstrap.sh {worktree}"
bootstrap_requires = ["node_modules"]

# Copy the main checkout's index into the worktree and `codegraph sync` it (about 7 s for kma's
# 362 MB index, 2026-11-23), or `codegraph init -i` when there is none. A unit falls back to
# Grep and LSP if it is absent or fails.
codegraph_init = true

# What the homelab verify runs (pr-drain/scripts/remote-verify.sh: ${RV_CMD:-pnpm verify};
# package.json "verify": "./.claude/verify.sh").
full_verify_command = "pnpm verify"
# scripts/verify-stamp.sh `write <tree>` records <tree> as passed in <git common dir>/verify-pass/.
# .husky/pre-push looks for the stamp of `git rev-parse <pushed sha>^{tree}`, which is the tree
# stamp-remote-pass hands over: the worktree is clean and at the verified commit.
stamp_command = "bash scripts/verify-stamp.sh write {tree}"

# Shown in the tracker header. A description only; the code enforces it.
unit_permissions = "triage readers: Read, Grep, Glob only. Units: edit and run in their own worktree under the guards mod; gh-write comment, add-label (never the claim label), ensure-label, pr-create, thread-reply, thread-resolve; no merge, no closing issues, no protected paths"
